services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: equahome
      POSTGRES_PASSWORD: equahome
      POSTGRES_DB: equahome
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equahome"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO (S3-compatible) se añade en la fase de fotos.

volumes:
  postgres_data:
